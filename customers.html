<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ИндигоСофт — Заказчики</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/font.css">
  <link rel="stylesheet" href="css/root.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
  <header class="topbar">
    <div class="topbar-start">
      <button class="icon-btn topbar__menu" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="sidebar">
        <img src="img/icons/menu.svg" alt="">
      </button>
      <a class="brand" href="index.html">
        <picture>
          <source media="(max-width: 767.98px)" srcset="img/logo-mobile.svg">
          <img class="brand-logo" src="img/logo.svg" alt="ИндигоСофт">
        </picture>
      </a>
      <h1 class="page-name">Заказчики</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn notification-btn" type="button" aria-label="Уведомления">
        <img src="img/icons/bell.svg" alt="">
        <i class="notification-dot"></i>
      </button>
      <button class="user-trigger" type="button" aria-expanded="false">
        <span class="avatar avatar-sm"></span>
        <span class="user-copy">
          <b>Мария Анисимова</b>
          <small>ООО "ИндигоСофт"</small>
        </span>
        <img class="user-chevron" src="img/icons/chevron-down.svg" alt="">
      </button>
    </div>
  </header>

  <div class="app-body">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar__nav">
      <a class="icon-btn icon-btn--label" href="index.html" title="Дашборд"><img src="img/icons/dashboard.svg" alt=""><span class="icon-btn__text">Дашборд</span></a>
      <a class="icon-btn icon-btn--label" href="requests.html" title="Входящие запросы"><img src="img/icons/inbox.svg" alt=""><span class="icon-btn__text">Входящие запросы</span></a>
      <a class="icon-btn icon-btn--label" href="documents.html" title="Исходящие документы"><img src="img/icons/document.svg" alt=""><span class="icon-btn__text">Исходящие документы</span></a>
      <a class="icon-btn icon-btn--label icon-btn--active" href="customers.html" title="Заказчики" aria-current="page"><img src="img/icons/users.svg" alt=""><span class="icon-btn__text">Заказчики</span></a>
      <a class="icon-btn icon-btn--label" href="tenders.html" title="Активные тендеры"><img src="img/icons/hammer.svg" alt=""><span class="icon-btn__text">Активные тендеры</span></a>
      <a class="icon-btn icon-btn--label" href="tender-products.html" title="Товары по тендерам"><img src="img/icons/handshake.svg" alt=""><span class="icon-btn__text">Товары по тендерам</span></a>
      <a class="icon-btn icon-btn--label" href="my-products.html" title="Мои товары"><img src="img/icons/cube.svg" alt=""><span class="icon-btn__text">Мои товары</span></a>
      <a class="icon-btn icon-btn--label" href="#" title="Статистика"><img src="img/icons/chart.svg" alt=""><span class="icon-btn__text">Статистика</span></a>
      <a class="icon-btn icon-btn--label" href="price-management.html" title="Управление прайсами"><img src="img/icons/settings.svg" alt=""><span class="icon-btn__text">Управление прайсами</span></a>
      <a class="icon-btn icon-btn--label" href="#" title="Предложить идею"><img src="img/icons/chat.svg" alt=""><span class="icon-btn__text">Предложить идею</span></a>
    </nav>
    <a class="icon-btn icon-btn--label sidebar__info" href="#" title="О платформе"><img src="img/icons/info.svg" alt=""><span class="icon-btn__text">О платформе</span></a>
  </aside>
  <div class="sidebar__backdrop"></div>

  <main class="app-main">

    <section class="customers-empty">
      <div class="customer-skeletons" aria-hidden="true">
        <div class="customer-skeleton small"><i></i><span></span><span></span><span></span></div>
        <div class="customer-skeleton"><i></i><span></span><span></span><span></span></div>
        <div class="customer-skeleton small"><i></i><span></span><span></span><span></span></div>
      </div>
      <h2>Здесь пока нет заказчиков</h2>
      <p>Добавьте компанию, чтобы начать работу<br>с документами и отслеживать аккредитации.</p>
      <div class="customers-actions">
        <button type="button"><img src="img/icons/plus.svg" alt="">Заявка на аккредитацию</button>
        <button class="primary" type="button"><img src="img/icons/plus.svg" alt="">Добавить заказчика</button>
      </div>
    </section>
  </main>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
